<!DOCTYPE html>
<html>
<head>
<title>KAN-1 Test Execution Report</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
table { border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
th { background-color: #f0f0f0; }
.pass { background-color: #d4edda; }
.fail { background-color: #f8d7da; }
.img { max-width: 400px; border: 1px solid #ccc; }
h1 { color: #333; }
.summary { margin: 20px 0; padding: 10px; background-color: #e7f3ff; border-left: 4px solid #2196F3; }
</style>
</head>
<body>
<h1>Defect: KAN-1 - Test Execution Report</h1>
<div class="summary">
<p><strong>Defect:</strong> Add Element button does not create Delete button</p>
<p><strong>Status:</strong> <span id="status">EXECUTING...</span></p>
<p><strong>Total Steps:</strong> <span id="total">-</span> | <strong>Passed:</strong> <span id="passed">-</span> | <strong>Failed:</strong> <span id="failed">-</span></p>
</div>
<table id="results">
<tr>
<th>Step #</th>
<th>Description</th>
<th>Status</th>
<th>Screenshot</th>
</tr>
</table>
</body>
</html>
